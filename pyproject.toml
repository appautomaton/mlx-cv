[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-cv"
version = "0.0.3"
description = "MLX-native computer vision for Apple Silicon: open-vocabulary grounding, object detection, depth and camera geometry, segmentation, and video object tracking."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AppAutomaton", email = "brian@bhoneycutt.com" }]
keywords = [
    "mlx",
    "computer-vision",
    "object-detection",
    "segmentation",
    "panoptic-segmentation",
    "depth-estimation",
    "object-tracking",
    "open-vocabulary",
    "apple-silicon",
    "sam",
    "locate-anything",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "pillow>=9.0",
]

[project.optional-dependencies]
# Run models on Apple Silicon. mlx loads/saves safetensors natively (mx.load / mx.save_safetensors),
# so no separate `safetensors` package is needed.
mlx = ["mlx>=0.18"]
# Optional remote snapshot resolution for from_pretrained. Local packages and
# direct checkpoint paths require no Hub dependency.
hub = [
    "huggingface_hub>=0.20",
    "tokenizers>=0.20",
]

[project.urls]
Homepage = "https://appautomaton.renocrypt.com/mlx-cv/"
Repository = "https://github.com/appautomaton/mlx-cv"
Documentation = "https://github.com/appautomaton/mlx-cv/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/appautomaton/mlx-cv/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_cv"]
