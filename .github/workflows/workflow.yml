name: Publish to PyPI

# Trusted publishing (OIDC) — no API tokens.
# Matches the PyPI publisher config: repo appautomaton/mlx-cv,
# workflow file workflow.yml, environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mlx-cv/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      # PyPA suggests the floating release/v1 tag. This job is the one place in
      # the repository that holds an OIDC id-token, so it pins an exact release
      # instead: a compromised upstream tag here could publish as us. Re-pin
      # deliberately rather than drifting.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
